# DSH profile 接线示例（片段，不是完整文件）
#
# 用法：把需要的条目合并进你自己的
#   %USERPROFILE%\.dsh\profiles\desktop\cordis.patch.yml
# 不要整份覆盖：profile 里还有模型、主题、权限等其它配置。
# 这里的账号、路径、token 全是占位，按实际改。

# 1) 官方 QQ 机器人通道与 SnowLuma 链路重复，停用，避免两套人设/两条连接互相打架。
- id: im-qqbot
  disabled: true

# 2) 旧链路：dsh-onebot 主动连接 SnowLuma 的 OneBot 11 WS。
- id: dsh-onebot
  disabled: true           # 当前主链路是 AstrBot；旧链路要启用时改成 false
  config:
    mode: forward
    url: ws://127.0.0.1:3001
    accessToken: ""        # 与 SnowLuma 的 OneBot 配置一致
    botQQ: "10001"
    adminUsers:
      - "10000"
    workspacePath: <WORKSPACE_DIR>
    provider: ninfer
    model: <MODEL_NAME>
    requireMention: true
    logLevel: info
    # 调试注入：默认关闭；开启时也必须保持 dry-run，避免真的发出 QQ 消息。
    injectEnabled: false
    injectDryRun: true

# 3) 自研 OneBot 通道骨架（只读灰度，不发送消息）。
- id: qq-onebot
  disabled: true
  config:
    url: ws://127.0.0.1:3001
    accessToken: ""
    botQQ: "10001"
    masterQQ: "10000"
    workspacePath: <WORKSPACE_DIR>
    logPath: <LOG_DIR>\s0.log
    provider: ninfer
    model: <MODEL_NAME>
